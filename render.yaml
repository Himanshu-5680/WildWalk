services:
  - type: web
    name: wildwalk-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars: &env
      - {key: LLM_BASE_URL, sync: false}
      - {key: GEMMA_MODEL, value: "gemma3:4b"}
      - {key: SERPAPI_KEY, sync: false}
      - {key: ELEVEN_API_KEY, sync: false}
      - {key: TIGER_URL, sync: false}
      - {key: MONGO_URI, sync: false}
      - {key: SENTRY_DSN, sync: false}
      - {key: TEMPORAL_ADDRESS, sync: false}
  - type: worker
    name: wildwalk-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars: *env
